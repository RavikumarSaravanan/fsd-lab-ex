<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Color Changer App</title> 
    <!-- Link External CSS --> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
 
    <h1>DOM-Based Color Changer</h1> 
 
    <div class="button-container"> 
        <button id="redBtn">Red</button> 
        <button id="greenBtn">Green</button> 
        <button id="blueBtn">Blue</button> 
        <button id="resetBtn">Reset</button> 
    </div> 
 
    <!-- New elements for Practice Exercise 1 and 2 -->
    <div class="custom-color-container">
        <input type="text" id="customColor" placeholder="Enter color name or code (e.g., yellow, #ff0000)">
        <button id="applyCustomBtn">Apply Custom Color</button>
    </div>
    <div id="colorDisplay">Current Color: white</div>
 
    <!-- Link External JavaScript --> 
    <script src="script.js"></script> 
</body> 
</html>
