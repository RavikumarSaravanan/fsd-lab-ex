<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <title>To-Do List App</title> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
 
    <h1>To-Do List</h1> 
 
    <!-- New element for task count display -->
    <div id="taskCount">Total Tasks: 0, Completed: 0</div>
 
    <div class="container"> 
        <input type="text" id="taskInput" placeholder="Enter a task"> 
        <button id="addBtn">Add Task</button> 
    </div> 
 
    <ul id="taskList"></ul> 
 
    <script src="script.js"></script> 
</body> 
</html>
